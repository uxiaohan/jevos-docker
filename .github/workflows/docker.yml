name: docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: jevos release tag
        default: jevos-v5
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  JEV_VERSION: ${{ inputs.version || 'jevos-v5' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/jevos
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "sha=$(git rev-parse --short=6 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Require Docker Hub secrets
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "${U:-}" && test -n "${T:-}" \
            || { echo "::error::Set repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: JEV_VERSION=${{ env.JEV_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # End-to-end check on the pushed image: it starts, loads the model and
      # answers a real decision. A green build alone proves nothing.
      - name: Smoke test
        run: |
          set -eux
          docker pull "$IMAGE:${{ steps.tag.outputs.sha }}"
          docker run -d --name jev -p 8017:8017 --memory=3g \
            -e THREADS=2 -e JEV_API_KEY=smoke "$IMAGE:${{ steps.tag.outputs.sha }}"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8017/health && break || sleep 2
          done
          out=$(curl -fsS http://127.0.0.1:8017/v1/systemone \
            -H 'Content-Type: application/json' -H 'Authorization: Bearer smoke' \
            -d '{"model":"jevos-v5","state":"My invoice shows a charge I do not recognize.","questions":{"billing":{"type":"noul","instructions":"Is this a billing problem?"}}}')
          echo "$out"
          echo "$out" | jq -e '.answers.billing.noul > 0.5'
          docker logs jev
          docker rm -f jev
